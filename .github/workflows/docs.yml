name: 文档检查
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 固定官方 v7.0.1 提交
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
